<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>근무 및 장비/출퇴근 실시간 통합 관리 시스템</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    button, input, select, textarea { touch-action: manipulation; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 antialiased selection:bg-indigo-500 selection:text-white min-h-screen">

  <div id="root"></div>

  <!-- Firebase Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Vercel 외부 배포 시 모든 사용자 및 모든 기기가 동일한 실시간 데이터베이스에 접속할 수 있도록 Firebase 데모 DB 연결 구성을 고정 설정
    const firebaseConfig = typeof __firebase_config !== 'undefined'
      ? JSON.parse(__firebase_config)
      : { 
          apiKey: "AIzaSyDemoDefaultKeyForVercelAppPublicSync",
          authDomain: "commute-log-app.firebaseapp.com",
          projectId: "commute-log-app-default",
          storageBucket: "commute-log-app.appspot.com"
        };

    // 타 사용자 간 실시간 연동을 확증하는 글로벌 공용 앱 ID
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'commute-log-app-global-shared-v2';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.__cloud = {
      auth,
      db,
      appId,
      signInAnonymously,
      signInWithCustomToken,
      onAuthStateChanged,
      doc,
      setDoc,
      onSnapshot,
      collection
    };
  </script>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- Inline SVG Icons ---
    const IconUsers = () => (
      <svg className="w-4 h-4 sm:w-5 sm:h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
    );
    const IconClock = () => (
      <svg className="w-4 h-4 sm:w-5 sm:h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
    );
    const IconRadio = () => (
      <svg className="w-4 h-4 sm:w-5 sm:h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" /></svg>
    );
    const IconCap = () => (
      <svg className="w-4 h-4 sm:w-5 sm:h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 14l9-5-9-5-9 5 9 5z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0112 20.055a11.952 11.952 0 01-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" /></svg>
    );
    const IconCheckUser = () => (
      <svg className="w-4 h-4 sm:w-5 sm:h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
    );
    const IconMessage = () => (
      <svg className="w-4 h-4 sm:w-5 sm:h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>
    );
    const IconCheck = () => (
      <svg className="w-4 h-4 inline shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7" /></svg>
    );
    const IconPlus = () => (
      <svg className="w-4 h-4 inline shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 4v16m8-8H4" /></svg>
    );
    const IconCopy = () => (
      <svg className="w-4 h-4 inline shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>
    );

    const RADIO_SLOTS = [
      { id: 'team_leader', name: '팀장' },
      ...Array.from({ length: 20 }, (_, i) => ({ id: `radio_${i + 1}`, name: `${i + 1}번` })),
      { id: 'reserve_2', name: '예비2번' },
      { id: 'reserve_3', name: '예비3번' },
      { id: 'reserve_4', name: '예비4번' },
      { id: 'guide_1', name: '안내1번' },
    ];

    // 기본 예시 인원을 모두 지우고 빈 배열로 등록
    const INITIAL_MEMBERS = [];

    const getRoleBadge = (role) => {
      switch (role) {
        case '팀장': return 'bg-purple-100 text-purple-900 border-purple-300';
        case '주임': return 'bg-blue-100 text-blue-900 border-blue-300';
        default: return 'bg-slate-100 text-slate-800 border-slate-300';
      }
    };

    function App() {
      const [activeTab, setActiveTab] = useState('commute');
      const [user, setUser] = useState(null);

      const todayStr = useMemo(() => {
        const d = new Date();
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
      }, []);

      const [selectedDate, setSelectedDate] = useState(todayStr);
      const selectedMonthStr = useMemo(() => selectedDate.slice(0, 7), [selectedDate]);

      // States
      const [members, setMembers] = useState(INITIAL_MEMBERS);
      const [commuteData, setCommuteData] = useState({});
      const [radioAssignments, setRadioAssignments] = useState({});
      const [equipmentChecker, setEquipmentChecker] = useState('');
      const [trainings, setTrainings] = useState({});
      const [attendanceApprovals, setAttendanceApprovals] = useState({});
      const [posts, setPosts] = useState([
        {
          id: 'p1',
          title: '안전 수칙 준수 공지',
          author: '팀장',
          content: '현장 작업 시 반드시 안전모 및 장갑을 착용해 주세요.',
          createdAt: new Date().toISOString(),
          comments: [{ id: 'c1', author: '이영희', text: '확인했습니다!', createdAt: '09:10' }]
        }
      ]);

      // Cloud Auth & Sync Initialization
      useEffect(() => {
        let isMounted = true;
        const checkCloud = setInterval(async () => {
          if (window.__cloud) {
            clearInterval(checkCloud);
            const { auth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } = window.__cloud;
            try {
              // 전 세계 접속 사용자가 모두 익명 인증을 통해 동일 DB 경로에 연결 가능하도록 처리
              await signInAnonymously(auth);
            } catch (e) {
              console.warn("Auth initialization retry...", e);
            }
            if (isMounted) {
              onAuthStateChanged(auth, (usr) => setUser(usr));
            }
          }
        }, 100);
        return () => {
          isMounted = false;
          clearInterval(checkCloud);
        };
      }, []);

      // Realtime Cloud Listeners - 전 기기 공용 실시간 리스너 경로 수정
      useEffect(() => {
        if (!user || !window.__cloud) return;
        const { db, appId, doc, onSnapshot, setDoc } = window.__cloud;

        // 1. Members (인원 수정/추가 실시간 동기화)
        const membersDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'app_data', 'members');
        const unsubMembers = onSnapshot(membersDocRef, (docSnap) => {
          if (docSnap.exists() && docSnap.data() && docSnap.data().list) {
            setMembers(docSnap.data().list);
          } else {
            setMembers(INITIAL_MEMBERS);
            setDoc(membersDocRef, { list: INITIAL_MEMBERS }, { merge: true });
          }
        }, (err) => console.error("Members sync error", err));

        // 2. Commute Data
        const commuteDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'commute', selectedDate);
        const unsubCommute = onSnapshot(commuteDocRef, (docSnap) => {
          setCommuteData(docSnap.exists() ? docSnap.data().data || {} : {});
        }, (err) => console.error("Commute sync error", err));

        // 3. Radios
        const radioDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'radios', selectedDate);
        const unsubRadios = onSnapshot(radioDocRef, (docSnap) => {
          if (docSnap.exists()) {
            setRadioAssignments(docSnap.data().assignments || {});
            setEquipmentChecker(docSnap.data().checker || '');
          } else {
            setRadioAssignments({});
            setEquipmentChecker('');
          }
        }, (err) => console.error("Radios sync error", err));

        // 4. Trainings
        const trainingDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'trainings', selectedMonthStr);
        const unsubTrainings = onSnapshot(trainingDocRef, (docSnap) => {
          setTrainings(docSnap.exists() ? docSnap.data().data || {} : {});
        }, (err) => console.error("Training sync error", err));

        // 5. Attendance Approvals
        const approvalDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'approvals', selectedMonthStr);
        const unsubApprovals = onSnapshot(approvalDocRef, (docSnap) => {
          setAttendanceApprovals(docSnap.exists() ? docSnap.data().data || {} : {});
        }, (err) => console.error("Approvals sync error", err));

        // 6. Posts
        const postsDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'app_data', 'posts');
        const unsubPosts = onSnapshot(postsDocRef, (docSnap) => {
          setPosts(docSnap.exists() ? docSnap.data().list || [] : []);
        }, (err) => console.error("Posts sync error", err));

        return () => {
          unsubMembers();
          unsubCommute();
          unsubRadios();
          unsubTrainings();
          unsubApprovals();
          unsubPosts();
        };
      }, [user, selectedDate, selectedMonthStr]);

      // Cloud Helper Functions
      const saveCloudMembers = (newList) => {
        if (!user || !window.__cloud) return;
        const { db, appId, doc, setDoc } = window.__cloud;
        setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'app_data', 'members'), { list: newList }, { merge: true });
      };

      const saveCloudCommute = (newCommute) => {
        if (!user || !window.__cloud) return;
        const { db, appId, doc, setDoc } = window.__cloud;
        setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'commute', selectedDate), { data: newCommute }, { merge: true });
      };

      const saveCloudRadios = (newAssignments, newChecker) => {
        if (!user || !window.__cloud) return;
        const { db, appId, doc, setDoc } = window.__cloud;
        setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'radios', selectedDate), {
          assignments: newAssignments,
          checker: newChecker
        }, { merge: true });
      };

      const saveCloudTrainings = (newTrainings) => {
        if (!user || !window.__cloud) return;
        const { db, appId, doc, setDoc } = window.__cloud;
        setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'trainings', selectedMonthStr), { data: newTrainings }, { merge: true });
      };

      const saveCloudApprovals = (newApprovals) => {
        if (!user || !window.__cloud) return;
        const { db, appId, doc, setDoc } = window.__cloud;
        setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'approvals', selectedMonthStr), { data: newApprovals }, { merge: true });
      };

      const saveCloudPosts = (newPosts) => {
        if (!user || !window.__cloud) return;
        const { db, appId, doc, setDoc } = window.__cloud;
        setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'app_data', 'posts'), { list: newPosts }, { merge: true });
      };

      const [searchQuery, setSearchQuery] = useState('');
      const [copiedToast, setCopiedToast] = useState(false);
      const [isMemberModalOpen, setIsMemberModalOpen] = useState(false);
      const [editingMember, setEditingMember] = useState(null);
      const [memberForm, setMemberForm] = useState({ name: '', role: '사원', note: '' });
      const [customRadioInputs, setCustomRadioInputs] = useState({});
      const [attendanceNotes, setAttendanceNotes] = useState({});
      const [postForm, setPostForm] = useState({ title: '', author: '', content: '', imageUrl: '' });
      const [commentInputs, setCommentInputs] = useState({});

      const getCurrentFormattedTime = () => {
        const d = new Date();
        return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      };

      const handleExpectedTimeChange = (memberId, val) => {
        const updated = {
          ...commuteData,
          [memberId]: { ...(commuteData[memberId] || {}), expectedTime: val }
        };
        setCommuteData(updated);
        saveCloudCommute(updated);
      };

      const handleClockIn = (memberId) => {
        const currentTime = getCurrentFormattedTime();
        const updated = {
          ...commuteData,
          [memberId]: {
            ...(commuteData[memberId] || {}),
            status: '출근 완료',
            clockInTime: currentTime
          }
        };
        setCommuteData(updated);
        saveCloudCommute(updated);
      };

      const handleCancelClockIn = (memberId) => {
        const updated = {
          ...commuteData,
          [memberId]: {
            ...(commuteData[memberId] || {}),
            status: '미출근',
            clockInTime: ''
          }
        };
        setCommuteData(updated);
        saveCloudCommute(updated);
      };

      const handleSaveMember = (e) => {
        e.preventDefault();
        if (!memberForm.name.trim()) return;

        let newList;
        if (editingMember) {
          newList = members.map(m => m.id === editingMember.id ? {
            ...m,
            name: memberForm.name.trim(),
            role: memberForm.role,
            note: memberForm.note.trim()
          } : m);
        } else {
          const newMember = {
            id: 'm_' + Date.now(),
            name: memberForm.name.trim(),
            role: memberForm.role || '사원',
            note: memberForm.note.trim()
          };
          newList = [...members, newMember];
        }
        setMembers(newList);
        saveCloudMembers(newList);
        setMemberForm({ name: '', role: '사원', note: '' });
        setEditingMember(null);
        setIsMemberModalOpen(false);
      };

      const handleDeleteMember = (id) => {
        const newList = members.filter(m => m.id !== id);
        setMembers(newList);
        saveCloudMembers(newList);
      };

      const handleRadioSelectChange = (slotId, val) => {
        let updatedAssignments = { ...radioAssignments };
        if (val === '__DIRECT__') {
          setCustomRadioInputs(prev => ({ ...prev, [slotId]: '' }));
          updatedAssignments[slotId] = '직접입력';
        } else {
          const newCustoms = { ...customRadioInputs };
          delete newCustoms[slotId];
          setCustomRadioInputs(newCustoms);
          updatedAssignments[slotId] = val;
        }
        setRadioAssignments(updatedAssignments);
        saveCloudRadios(updatedAssignments, equipmentChecker);
      };

      const handleCustomRadioText = (slotId, text) => {
        setCustomRadioInputs(prev => ({ ...prev, [slotId]: text }));
        const updatedAssignments = { ...radioAssignments, [slotId]: text || '미배정' };
        setRadioAssignments(updatedAssignments);
        saveCloudRadios(updatedAssignments, equipmentChecker);
      };

      const handleCheckerChange = (val) => {
        setEquipmentChecker(val);
        saveCloudRadios(radioAssignments, val);
      };

      const copyRadioFormat = () => {
        let report = `[무전기 배정 현황 - ${selectedDate}]\n\n`;
        RADIO_SLOTS.forEach(slot => {
          const val = radioAssignments[slot.id] || '미배정';
          report += `${slot.name} : ${val}\n`;
        });
        report += `\n장비파악자 : ${equipmentChecker || '미입력'}`;

        const successAction = () => {
          setCopiedToast(true);
          setTimeout(() => setCopiedToast(false), 3000);
        };

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(report).then(successAction).catch(() => fallbackCopy(report, successAction));
        } else {
          fallbackCopy(report, successAction);
        }
      };

      const fallbackCopy = (text, callback) => {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try {
          if (document.execCommand('copy')) callback();
        } catch (e) {
          console.error("복사 오류", e);
        }
        document.body.removeChild(ta);
      };

      const handleToggleTraining = (memberId) => {
        const current = trainings[memberId]?.completed;
        const updated = {
          ...trainings,
          [memberId]: {
            completed: !current,
            completedAt: !current ? new Date().toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' }) + ' ' + new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) : null
          }
        };
        setTrainings(updated);
        saveCloudTrainings(updated);
      };

      const handleToggleApproval = (memberId) => {
        const current = attendanceApprovals[memberId]?.approved;
        const noteText = attendanceNotes[memberId] ?? (attendanceApprovals[memberId]?.note || '');
        const updated = {
          ...attendanceApprovals,
          [memberId]: {
            approved: !current,
            approvedAt: !current ? new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) : null,
            note: noteText
          }
        };
        setAttendanceApprovals(updated);
        saveCloudApprovals(updated);
      };

      const handleAttendanceNoteSave = (memberId) => {
        const noteText = attendanceNotes[memberId] || '';
        const updated = {
          ...attendanceApprovals,
          [memberId]: {
            ...(attendanceApprovals[memberId] || { approved: false, approvedAt: null }),
            note: noteText
          }
        };
        setAttendanceApprovals(updated);
        saveCloudApprovals(updated);
      };

      const handleCreatePost = (e) => {
        e.preventDefault();
        if (!postForm.title.trim() || !postForm.content.trim()) return;

        const newPost = {
          id: 'p_' + Date.now(),
          title: postForm.title.trim(),
          author: postForm.author.trim() || '익명',
          content: postForm.content.trim(),
          imageUrl: postForm.imageUrl.trim(),
          createdAt: new Date().toISOString(),
          comments: []
        };
        const newList = [newPost, ...posts];
        setPosts(newList);
        saveCloudPosts(newList);
        setPostForm({ title: '', author: '', content: '', imageUrl: '' });
      };

      const handleAddComment = (postId) => {
        const text = commentInputs[postId];
        if (!text || !text.trim()) return;

        const newComment = {
          id: 'c_' + Date.now(),
          author: '대원',
          text: text.trim(),
          createdAt: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })
        };

        const newList = posts.map(p => p.id === postId ? {
          ...p,
          comments: [...(p.comments || []), newComment]
        } : p);

        setPosts(newList);
        saveCloudPosts(newList);
        setCommentInputs(prev => ({ ...prev, [postId]: '' }));
      };

      const handleDeletePost = (postId) => {
        const newList = posts.filter(p => p.id !== postId);
        setPosts(newList);
        saveCloudPosts(newList);
      };

      const filteredMembers = useMemo(() => {
        return members.filter(m =>
          m.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
          (m.role && m.role.toLowerCase().includes(searchQuery.toLowerCase()))
        );
      }, [members, searchQuery]);

      const totalCount = members.length;
      const completedCount = members.filter(m => commuteData[m.id]?.status === '출근 완료').length;
      const pendingCount = totalCount - completedCount;

      return (
        <div className="min-h-screen flex flex-col bg-slate-100 pb-10">
          {copiedToast && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-emerald-600 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center space-x-2 text-xs sm:text-sm font-extrabold border border-emerald-400 animate-bounce w-[90%] max-w-sm justify-center">
              <IconCheck />
              <span>양식이 클립보드에 복사되었습니다!</span>
            </div>
          )}

          {/* Header */}
          <header className="bg-indigo-950 text-white shadow-xl sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="bg-indigo-600 p-2 rounded-xl shadow-inner border border-indigo-400">
                  <IconUsers />
                </div>
                <div>
                  <h1 className="font-extrabold text-base sm:text-xl tracking-tight leading-tight text-white">실시간 현장 통합 관리</h1>

            {activeTab === 'board' && (
              <div className="space-y-4">
                <div className="bg-white p-4 rounded-2xl border-2 border-slate-200 shadow-sm space-y-3">
                  <h2 className="text-xs font-black text-slate-900 border-b border-slate-100 pb-2">새 게시글 등록</h2>
                  <form onSubmit={handleCreatePost} className="space-y-2.5">
                    <input
                      type="text"
                      required
                      placeholder="제목"
                      value={postForm.title}
                      onChange={(e) => setPostForm({ ...postForm, title: e.target.value })}
                      className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                    <textarea
                      rows="2"
                      required
                      placeholder="내용을 작성하세요..."
                      value={postForm.content}
                      onChange={(e) => setPostForm({ ...postForm, content: e.target.value })}
                      className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                    <button
                      type="submit"
                      className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-xl text-xs font-black shadow-md active:scale-95"
                    >
                      게시하기
                    </button>
                  </form>
                </div>

                <div className="space-y-3">
                  {posts.map((post) => (
                    <div key={post.id} className="bg-white p-4 rounded-2xl border-2 border-slate-200 shadow-sm space-y-3">
                      <div className="flex justify-between items-start border-b border-slate-100 pb-2">
                        <h3 className="font-extrabold text-slate-900 text-sm">{post.title}</h3>
                        <button
                          onClick={() => handleDeletePost(post.id)}
                          className="text-[10px] text-rose-700 bg-rose-50 px-2 py-0.5 rounded-md font-bold border border-rose-200"
                        >
                          삭제
                        </button>
                      </div>
                      <p className="text-xs text-slate-800 font-medium whitespace-pre-line leading-relaxed">{post.content}</p>

                      <div className="bg-slate-50 p-3 rounded-xl space-y-2 border border-slate-200">
                        {post.comments && post.comments.map((c) => (
                          <div key={c.id} className="text-[11px] text-slate-800 bg-white p-2 rounded-lg border border-slate-200 font-semibold">
                            <span className="font-black text-indigo-900">{c.author}:</span> {c.text}
                          </div>
                        ))}
                        <div className="flex space-x-1.5 pt-1">
                          <input
                            type="text"
                            placeholder="댓글 쓰기..."
                            value={commentInputs[post.id] || ''}
                            onChange={(e) => setCommentInputs({ ...commentInputs, [post.id]: e.target.value })}
                            className="flex-1 px-3 py-1.5 border border-slate-300 rounded-xl text-xs font-medium"
                          />
                          <button
                            onClick={() => handleAddComment(post.id)}
                            className="bg-indigo-600 text-white px-3 py-1.5 rounded-xl text-xs font-black shadow-sm"
                          >
                            등록
                          </button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
